name: Update release packages

on:
  repository_dispatch:
    types: [handshake-release-published, twine-release-published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published vMAJOR.MINOR.PATCH tag (blank selects latest stable)
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: update-handshake
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Authenticate the tap update bot
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Verify the selected release and update its package
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag }}
        run: make update
      - name: Open the update PR and merge its validated commit
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_CHECK_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.update.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python3 scripts/propose_update.py
